server {
    listen 80;
    listen [::]:80;

    server_name __WEB_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root __WEB_ROOT__;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name __WEB_HOST__;

    root __WEB_ROOT__;
    index index.html;

    ssl_certificate __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /health {
        proxy_pass http://127.0.0.1:8101/health;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8101/ready;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8101/openapi.json;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8101/docs;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
